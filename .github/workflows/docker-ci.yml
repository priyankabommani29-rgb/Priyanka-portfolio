name: Docker CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
         run: |
           if [ -z "$DOCKERHUB_USERNAME" ]; then
              echo "❌ Username secret is EMPTY"
           else
              echo "✅ Username secret is available"
           fi

           if [ -z "$DOCKERHUB_TOKEN" ]; then
              echo "❌ Token secret is EMPTY"
           else
              echo "✅ Token secret is available"
           fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t priyankab29/docker-ci-pipeline:latest .

      - name: Push Docker image
        run: docker push priyankab29/docker-ci-pipeline:latest